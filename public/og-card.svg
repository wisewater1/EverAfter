<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="EverAfter AI — Your Digital Legacy, Preserved">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset="0.55" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <g transform="translate(600,360)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <circle cx="0" cy="0" r="30" fill="url(#accent)"/>
  </g>
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#e5e7eb" font-weight="600" letter-spacing="2">EVERAFTER AI</text>
  <text x="600" y="660" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#ffffff" font-weight="700">Your Digital Legacy,</text>
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="url(#accent)">Preserved.</text>
  <text x="600" y="850" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="34" fill="#94a3b8">Memories, voice &amp; personality — kept alive</text>
  <text x="600" y="898" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="34" fill="#94a3b8">for generations.</text>
  <rect x="510" y="968" width="180" height="7" rx="3.5" fill="url(#accent)"/>
</svg>
