<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EverAfter AI — Your Digital Legacy, Preserved">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset="0.55" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="90" cy="90" r="34" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="90" cy="90" r="13" fill="url(#accent)"/>
  <text x="142" y="101" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e5e7eb" font-weight="600">EverAfter AI</text>
  <text x="80" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#ffffff" font-weight="700">Your Digital Legacy,</text>
  <text x="80" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="url(#accent)">Preserved.</text>
  <text x="82" y="468" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="32" fill="#94a3b8">Memories, voice &amp; personality — kept alive for generations.</text>
  <rect x="80" y="520" width="220" height="6" rx="3" fill="url(#accent)"/>
</svg>
