<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="EverAfter AI — Your Digital Legacy, Preserved">
  <!--
    Composed as a 1200x1200 square (qlmanage rasterizes square SVGs 1:1 cleanly),
    with all artwork inside the centre 1200x630 band (rows 285..915) so a centred
    crop yields the 1.91:1 share card. The bg gradient fills the whole square, so
    any crop slack shows gradient, never transparency.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset="0.55" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <g transform="translate(600,420)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="0" cy="0" r="20" fill="url(#accent)"/>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e5e7eb" font-weight="600" letter-spacing="3">EVERAFTER AI</text>
  <text x="600" y="612" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#ffffff" font-weight="700">Your Digital Legacy,</text>
  <text x="600" y="694" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="url(#accent)">Preserved.</text>
  <text x="600" y="770" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="28" fill="#94a3b8">Memories, voice &amp; personality — kept alive for generations.</text>
  <rect x="540" y="818" width="120" height="6" rx="3" fill="url(#accent)"/>
</svg>
